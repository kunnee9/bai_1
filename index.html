<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Khung bọc tạo hiệu ứng xoay 3D -->
    <div class="card-container">
        <div class="card">
            
            <!-- MẶT TRƯỚC (Thông tin cá nhân) -->
            <div class="card-front">
                <img src="img/toi.png" alt="" class="avatar">
                <h2>Dang Dat Nguyen</h2>
                <p class="job">Lập trình viên Front-End</p>
                
                <div class="social-links">
                    <a href="#" class="btn">GitHub</a>
                    <a href="#" class="btn">Facebook</a>
                    <a href="#" class="btn">Gmail</a>
                </div>
            </div>

            <!-- MẶT SAU (Kỹ năng & Mục tiêu) -->
            <div class="card-back">
                <h2>Kỹ Năng</h2>
                <ul class="skills-list">
                    <li>✔ HTML5 / CSS3</li>
                    <li>✔ Flexbox & Responsive</li>
                    <li>✔ Git & GitHub</li>
                    <li>✔ VS Code Pro</li>
                </ul>
                <p class="quote">"Kiên trì mỗi ngày 20 dòng code!"</p>
            </div>

        </div>
    </div>

</body>
</html>
